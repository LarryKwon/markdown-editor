<title>마크다운 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#F1F4F1;
    --surface:#FFFFFF;
    --surface-2:#E7EDE8;
    --line:#D6DED8;
    --line-soft:#E4EAE5;
    --ink:#141D1A;
    --muted:#647069;
    --accent:#0E6B52;
    --accent-ink:#0B5240;
    --accent-soft:#DAEDE4;
    --danger:#A23529;
    --shadow:0 1px 2px rgba(20,29,26,.06), 0 8px 24px rgba(20,29,26,.05);
    --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --font-mono:"JetBrains Mono","IBM Plex Sans KR",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0E1412;
      --surface:#151B19;
      --surface-2:#1D2523;
      --line:#2A3431;
      --line-soft:#212B28;
      --ink:#E5ECE8;
      --muted:#8E9D96;
      --accent:#5FD3AC;
      --accent-ink:#8AE3C6;
      --accent-soft:#16302A;
      --danger:#F0958A;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0E1412;
    --surface:#151B19;
    --surface-2:#1D2523;
    --line:#2A3431;
    --line-soft:#212B28;
    --ink:#E5ECE8;
    --muted:#8E9D96;
    --accent:#5FD3AC;
    --accent-ink:#8AE3C6;
    --accent-soft:#16302A;
    --danger:#F0958A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  }

  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--font-ui);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  *{box-sizing:border-box}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  .app{height:100%;display:flex;flex-direction:column;min-height:0}

  /* ── top bar ───────────────────────────────────────────── */
  .topbar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding-block:10px;padding-inline:16px;
    background:var(--surface);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:9px;margin-right:2px}
  .mark{
    width:26px;height:26px;border-radius:7px;background:var(--accent);
    color:var(--surface);display:grid;place-items:center;
    font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.02em;
  }
  .brand h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
  .sync{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;color:var(--muted);white-space:nowrap;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
  .sync[data-state="saved"] .dot{background:var(--accent)}
  .sync[data-state="saving"] .dot{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
  .sync[data-state="error"] .dot{background:var(--danger)}
  .sync[data-state="local"] .dot{background:var(--muted)}
  @keyframes pulse{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.sync .dot{animation:none}}
  .spacer{flex:1 1 auto}

  .people{display:flex;align-items:center;gap:0}
  .people .av{
    width:26px;height:26px;border-radius:50%;object-fit:cover;
    border:2px solid var(--surface);margin-left:-7px;background:var(--surface-2);
  }
  .people .av:first-child{margin-left:0}
  .people .more{
    font-size:11px;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums;
  }

  .btn{
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;
    transition:background .12s ease,border-color .12s ease;
  }
  .btn:hover{background:var(--surface-2)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .btn-primary{color:#07100D}
  .btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .btn-primary{color:#07100D}
    :root:not([data-theme="light"]) .mark{color:#07100D}
  }
  .btn-quiet{border-color:transparent;background:transparent;color:var(--muted)}
  .btn-quiet:hover{background:var(--surface-2);color:var(--ink)}
  .btn-danger:hover{color:var(--danger)}

  /* ── shell ─────────────────────────────────────────────── */
  .shell{flex:1;min-height:0;display:grid;grid-template-columns:288px minmax(0,1fr)}

  .sidebar{
    background:var(--surface);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  .search-row{padding:12px 16px;border-bottom:1px solid var(--line-soft)}
  .search{
    width:100%;border:1px solid var(--line);background:var(--ground);
    border-radius:8px;padding:7px 11px;font-size:13px;
  }
  .search::placeholder{color:var(--muted)}
  .list{list-style:none;margin:0;padding:8px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:2px}
  .item{
    width:100%;text-align:left;border:1px solid transparent;background:transparent;
    border-radius:9px;padding:10px 11px;display:grid;gap:3px;
  }
  .item:hover{background:var(--surface-2)}
  .item[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent-soft)}
  .item-top{display:flex;align-items:baseline;gap:8px}
  .item-title{
    font-size:13.5px;font-weight:500;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .item-time{font-size:11px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
  .item-snip{
    font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .item-here{
    display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--accent-ink);
    font-weight:500;
  }
  .item-here::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .empty-list{padding:28px 16px;color:var(--muted);font-size:13px;text-align:center}

  /* ── editor area ───────────────────────────────────────── */
  .editor-area{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}
  .doc-head{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding-block:9px;padding-inline:16px;border-bottom:1px solid var(--line-soft);
  }
  .doc-meta{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px;gap:2px}
  .seg button{
    border:0;background:transparent;border-radius:6px;padding:4px 10px;
    font-size:12.5px;color:var(--muted);font-weight:500;
  }
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

  .notice{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding-block:8px;padding-inline:16px;
    background:var(--accent-soft);border-bottom:1px solid var(--line-soft);
    font-size:12.5px;
  }

  .panes{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}
  .pane{min-width:0;min-height:0;display:flex;flex-direction:column}
  .pane-preview{border-left:1px solid var(--line-soft);overflow-y:auto;background:var(--ground)}
  #editor{
    flex:1;width:100%;border:0;resize:none;background:var(--surface);
    padding:20px 18px;font-family:var(--font-mono);font-size:14px;line-height:1.75;
    tab-size:2;
  }
  #editor:focus{outline:none}
  #editor[readonly]{color:var(--muted)}
  .pane-foot{
    display:flex;gap:14px;padding-block:6px;padding-inline:18px;
    border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  [data-view="edit"] .pane-preview{display:none}
  [data-view="edit"] .panes{grid-template-columns:minmax(0,1fr)}
  [data-view="preview"] .pane-edit{display:none}
  [data-view="preview"] .panes{grid-template-columns:minmax(0,1fr)}

  .blank{
    flex:1;display:grid;place-items:center;padding:32px 16px;text-align:center;color:var(--muted);
  }
  .blank>div{max-width:min(34ch,100%)}
  .blank p{margin:0 0 16px}

  /* ── markdown preview ──────────────────────────────────── */
  .md{padding:22px 24px;max-width:70ch}
  .md>:first-child{margin-top:0}
  .md h1,.md h2,.md h3,.md h4{line-height:1.3;text-wrap:balance;margin:1.6em 0 .5em;font-weight:600;letter-spacing:-.015em}
  .md h1{font-size:1.65rem;padding-bottom:.3em;border-bottom:1px solid var(--line)}
  .md h2{font-size:1.3rem}
  .md h3{font-size:1.1rem}
  .md h4{font-size:1rem;color:var(--muted)}
  .md p,.md ul,.md ol,.md blockquote,.md table{margin:0 0 1em}
  .md ul,.md ol{padding-left:1.35em}
  .md li{margin:.25em 0}
  .md li::marker{color:var(--accent)}
  .md a{color:var(--accent-ink);text-underline-offset:2px}
  .md strong{font-weight:600}
  .md blockquote{
    border-left:3px solid var(--accent);padding:2px 0 2px 14px;color:var(--muted);
  }
  .md code{
    font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);
    padding:.12em .38em;border-radius:5px;
  }
  .md pre{
    background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;
    padding:13px 15px;overflow-x:auto;margin:0 0 1em;
  }
  .md pre code{background:none;padding:0;font-size:.85em;line-height:1.7}
  .md hr{border:0;border-top:1px solid var(--line);margin:1.8em 0}
  .md table{border-collapse:collapse;font-size:.92em;display:block;overflow-x:auto;max-width:100%}
  .md th,.md td{border:1px solid var(--line);padding:6px 11px;text-align:left}
  .md th{background:var(--surface-2);font-weight:600}
  .md img{max-width:100%;border-radius:8px}
  .md input[type="checkbox"]{accent-color:var(--accent);margin-right:.4em}
  .md .fallback{white-space:pre-wrap;font-family:var(--font-mono);font-size:.86em}

  .only-narrow{display:none}
  .scrim{display:none}

  @media (max-width:880px){
    .shell{grid-template-columns:minmax(0,1fr)}
    .sidebar{
      position:fixed;z-index:20;inset:0 auto 0 0;width:min(84vw,300px);
      box-shadow:var(--shadow);transform:translateX(-102%);
      transition:transform .18s ease;padding-top:env(safe-area-inset-top,0px);
    }
    .app[data-list="open"] .sidebar{transform:none}
    .app[data-list="open"] .scrim{
      display:block;position:fixed;inset:0;z-index:15;background:rgba(10,16,14,.4);border:0;
    }
    .only-narrow{display:inline-flex}
    .topbar{gap:10px}
    .sync{order:9;flex:1 1 100%;font-size:11.5px}
    .brand h1{font-size:14px}
    .no-narrow{display:none}
    .panes{grid-template-columns:minmax(0,1fr)}
    .md{padding:18px 16px}
    #editor{padding:16px}
  }
  @media (prefers-reduced-motion:reduce){.sidebar{transition:none}}
</style>

<div class="app" id="app" data-view="split" data-list="closed">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">MD</span>
      <h1>마크다운 노트</h1>
    </div>
    <button class="btn only-narrow" id="listToggle" aria-expanded="false">노트 목록</button>
    <span class="sync" id="sync" data-state="idle" role="status"><span class="dot"></span><span id="syncText">연결 중…</span></span>
    <span class="spacer"></span>
    <div class="people" id="people" aria-label="지금 보고 있는 사람"></div>
    <button class="btn btn-primary" id="newNote">새 노트</button>
  </header>

  <div class="shell">
    <button class="scrim" id="scrim" aria-label="목록 닫기"></button>
    <aside class="sidebar" id="sidebar" aria-label="노트 목록">
      <div class="search-row">
        <input class="search" id="search" type="search" placeholder="노트 검색" autocomplete="off">
      </div>
      <ul class="list" id="noteList"></ul>
    </aside>

    <section class="editor-area">
      <div class="doc-head">
        <span class="doc-meta" id="docMeta">노트를 불러오는 중…</span>
        <span class="spacer"></span>
        <div class="seg" id="viewSeg" role="group" aria-label="보기 방식">
          <button data-view="edit" aria-pressed="false">편집</button>
          <button data-view="split" aria-pressed="true" class="no-narrow">분할</button>
          <button data-view="preview" aria-pressed="false">미리보기</button>
        </div>
        <button class="btn btn-quiet btn-danger" id="deleteNote">삭제</button>
      </div>

      <div class="notice" id="notice" hidden>
        <span id="noticeText"></span>
        <span class="spacer"></span>
        <button class="btn" id="noticeAction" hidden>최신 내용 불러오기</button>
      </div>

      <div class="panes" id="panes">
        <div class="pane pane-edit">
          <textarea id="editor" spellcheck="false" placeholder="# 제목&#10;&#10;여기에 마크다운으로 적어 보세요." aria-label="마크다운 편집기"></textarea>
          <div class="pane-foot"><span id="charCount">0자</span><span id="lineCount">1줄</span></div>
        </div>
        <div class="pane pane-preview">
          <article class="md" id="preview"></article>
        </div>
      </div>

      <div class="blank" id="blank" hidden>
        <div>
          <p>아직 노트가 없습니다. 새 노트를 만들면 이 페이지를 볼 수 있는 모두에게 실시간으로 공유됩니다.</p>
          <button class="btn btn-primary" id="blankNew">첫 노트 만들기</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script>
(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };
  var app = $("app"), editor = $("editor"), preview = $("preview"), noteList = $("noteList");
  var syncEl = $("sync"), syncText = $("syncText"), docMeta = $("docMeta"), peopleEl = $("people");
  var notice = $("notice"), noticeText = $("noticeText"), noticeAction = $("noticeAction");
  var panes = $("panes"), blank = $("blank"), searchInput = $("search");

  var state = {
    notes: [],
    currentId: null,
    savedText: "",
    dirty: false,
    saving: false,
    readOnly: false,
    uid: null,
    peers: [],
    profiles: {},
    filter: "",
    mode: "local"   // "shared" once db answers
  };

  /* ── helpers ─────────────────────────────────────────── */

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function renderMarkdown(src){
    var text = src || "";
    try{
      if (window.marked && window.DOMPurify){
        var html = window.marked.parse(text, { gfm:true, breaks:true, headerIds:false, mangle:false });
        return window.DOMPurify.sanitize(html, { USE_PROFILES:{ html:true } });
      }
    }catch(e){ /* fall through to plain text */ }
    return '<pre class="fallback">' + escapeHtml(text) + "</pre>";
  }

  function deriveTitle(text){
    var lines = String(text || "").split("\n");
    for (var i=0;i<lines.length;i++){
      var line = lines[i].replace(/^\s*#{1,6}\s*/, "").replace(/[*_`>#-]/g, "").trim();
      if (line) return line.slice(0,70);
    }
    return "제목 없는 노트";
  }

  function snippetOf(note){
    var body = String(note.body || "");
    var lines = body.split("\n");
    var titleLine = -1;
    for (var i=0;i<lines.length;i++){ if (lines[i].trim()){ titleLine = i; break; } }
    var rest = lines.slice(titleLine+1).join(" ").replace(/[#*_`>|-]/g," ").replace(/\s+/g," ").trim();
    return rest || "내용 없음";
  }

  function relTime(ts){
    if (!ts) return "";
    var diff = Date.now() - ts;
    if (diff < 45000) return "방금";
    if (diff < 3600000) return Math.round(diff/60000) + "분 전";
    if (diff < 86400000) return Math.round(diff/3600000) + "시간 전";
    var d = new Date(ts);
    return (d.getMonth()+1) + "월 " + d.getDate() + "일";
  }

  function newId(){
    return "n" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
  }

  function setSync(stateName, text){
    syncEl.setAttribute("data-state", stateName);
    syncText.textContent = text;
  }

  function showNotice(text, actionLabel, onAction){
    noticeText.textContent = text;
    notice.hidden = false;
    if (actionLabel){
      noticeAction.hidden = false;
      noticeAction.textContent = actionLabel;
      noticeAction.onclick = onAction;
    } else {
      noticeAction.hidden = true;
      noticeAction.onclick = null;
    }
  }
  function hideNotice(){ notice.hidden = true; noticeAction.onclick = null; }

  /* ── storage: shared (db) or this-browser-only fallback ─ */

  function makeDbRepo(db){
    return {
      mode: "shared",
      subscribe: function(next, onError){
        return db.collection("notes").orderBy("updatedAt","desc").limit(200)
          .onSnapshot(function(snap){
            next(snap.docs.map(function(d){
              var body = d.data() || {};
              return {
                id: d.id,
                title: body.title || "",
                body: typeof body.body === "string" ? body.body : "",
                updatedAt: typeof body.updatedAt === "number" ? body.updatedAt : 0,
                updatedBy: typeof body.updatedBy === "string" ? body.updatedBy : null,
                createdAt: typeof body.createdAt === "number" ? body.createdAt : 0
              };
            }));
          }, onError);
      },
      save: function(id, data){ return db.doc("notes/" + id).set(data); },
      remove: function(id){ return db.doc("notes/" + id).delete(); }
    };
  }

  function makeLocalRepo(){
    var KEY = "md-notes-local-v1";
    var cache = [];
    var listeners = [];
    try{
      var raw = localStorage.getItem(KEY);
      if (raw) cache = JSON.parse(raw) || [];
    }catch(e){ cache = []; }
    function persist(){
      try{ localStorage.setItem(KEY, JSON.stringify(cache)); }catch(e){}
      listeners.forEach(function(fn){ fn(cache.slice().sort(byUpdated)); });
    }
    function byUpdated(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); }
    return {
      mode: "local",
      subscribe: function(next){
        listeners.push(next);
        setTimeout(function(){ next(cache.slice().sort(byUpdated)); }, 0);
        return function(){ listeners = listeners.filter(function(f){ return f !== next; }); };
      },
      save: function(id, data){
        var found = false;
        cache = cache.map(function(n){
          if (n.id === id){ found = true; return Object.assign({ id:id }, data); }
          return n;
        });
        if (!found) cache.push(Object.assign({ id:id }, data));
        persist();
        return Promise.resolve();
      },
      remove: function(id){
        cache = cache.filter(function(n){ return n.id !== id; });
        persist();
        return Promise.resolve();
      }
    };
  }

  var repo = makeLocalRepo();
  var unsubscribeNotes = null;

  /* ── rendering ───────────────────────────────────────── */

  function currentNote(){
    for (var i=0;i<state.notes.length;i++){ if (state.notes[i].id === state.currentId) return state.notes[i]; }
    return null;
  }

  function peersOnNote(noteId){
    return state.peers.filter(function(p){
      return !p.isMe && p.presence && p.presence.note === noteId;
    });
  }

  function visibleNotes(){
    if (!state.filter) return state.notes;
    var q = state.filter.toLowerCase();
    return state.notes.filter(function(n){
      return (n.title || "").toLowerCase().indexOf(q) >= 0 ||
             (n.body || "").toLowerCase().indexOf(q) >= 0;
    });
  }

  function renderList(){
    var items = visibleNotes();
    noteList.textContent = "";
    if (!items.length){
      var li = document.createElement("li");
      li.className = "empty-list";
      li.textContent = state.filter ? "검색 결과가 없습니다." : "노트가 없습니다.";
      noteList.appendChild(li);
      return;
    }
    items.forEach(function(note){
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.className = "item";
      btn.type = "button";
      btn.setAttribute("aria-current", note.id === state.currentId ? "true" : "false");
      btn.onclick = function(){ selectNote(note.id); closeList(); };

      var top = document.createElement("div");
      top.className = "item-top";
      var title = document.createElement("span");
      title.className = "item-title";
      title.textContent = note.title || deriveTitle(note.body);
      var time = document.createElement("span");
      time.className = "item-time";
      time.textContent = relTime(note.updatedAt);
      top.appendChild(title); top.appendChild(time);

      var snip = document.createElement("div");
      snip.className = "item-snip";
      snip.textContent = snippetOf(note);

      btn.appendChild(top);
      btn.appendChild(snip);

      var here = peersOnNote(note.id);
      if (here.length){
        var hereEl = document.createElement("span");
        hereEl.className = "item-here";
        hereEl.textContent = here.length + "명이 보는 중";
        btn.appendChild(hereEl);
      }

      li.appendChild(btn);
      noteList.appendChild(li);
    });
  }

  function renderMeta(){
    var note = currentNote();
    if (!note){ docMeta.textContent = ""; return; }
    var who = note.updatedBy ? (state.profiles[note.updatedBy] && state.profiles[note.updatedBy].name) : "";
    var when = relTime(note.updatedAt);
    var parts = [];
    if (when) parts.push(when + " 수정");
    if (who) parts.push(who);
    docMeta.textContent = parts.join(" · ") || "새 노트";
    resolveProfiles();
  }

  function renderPreviewPane(){
    preview.innerHTML = renderMarkdown(editor.value);
    $("charCount").textContent = editor.value.length.toLocaleString("ko-KR") + "자";
    $("lineCount").textContent = editor.value.split("\n").length.toLocaleString("ko-KR") + "줄";
  }

  function renderPeople(){
    var others = state.peers.filter(function(p){ return !p.isMe && p.kind === "viewer"; });
    peopleEl.textContent = "";
    others.slice(0,5).forEach(function(p){
      var uid = p.presence && p.presence.uid;
      var prof = uid ? state.profiles[uid] : null;
      var img = document.createElement("img");
      img.className = "av";
      img.alt = (prof && prof.name) || "다른 사용자";
      img.title = ((prof && prof.name) || "다른 사용자") + (p.presence && p.presence.note === state.currentId ? " · 이 노트" : "");
      img.src = (prof && prof.avatarUrl) || "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="16" fill="#9AA8A2"/></svg>');
      peopleEl.appendChild(img);
    });
    if (others.length > 5){
      var more = document.createElement("span");
      more.className = "more";
      more.textContent = "+" + (others.length - 5);
      peopleEl.appendChild(more);
    }
  }

  function renderBlankState(){
    var has = state.notes.length > 0;
    blank.hidden = has;
    panes.hidden = !has;
    $("deleteNote").hidden = !has;
    document.querySelector(".doc-head").style.display = has ? "" : "none";
  }

  var profileReqId = 0;
  function resolveProfiles(){
    if (!userNs) return;
    var ids = {};
    state.peers.forEach(function(p){ if (p.presence && p.presence.uid) ids[p.presence.uid] = 1; });
    state.notes.forEach(function(n){ if (n.updatedBy) ids[n.updatedBy] = 1; });
    var list = Object.keys(ids);
    if (!list.length) return;
    var reqId = ++profileReqId;
    userNs.profiles(list).then(function(map){
      if (reqId !== profileReqId) return;
      var changed = false;
      list.forEach(function(id){
        var incoming = map[id];
        if (!incoming) return;
        var prev = state.profiles[id];
        if (!prev || prev.name !== incoming.name || prev.avatarUrl !== incoming.avatarUrl){
          state.profiles[id] = incoming;
          changed = true;
        }
      });
      if (changed){ renderPeople(); renderMeta(); }
    });
  }

  /* ── note selection & editing ────────────────────────── */

  function selectNote(id, opts){
    if (state.currentId === id && !(opts && opts.force)) return;
    flushSave();
    state.currentId = id;
    var note = currentNote();
    var text = note ? note.body : "";
    editor.value = text;
    state.savedText = text;
    state.dirty = false;
    hideNotice();
    renderPreviewPane();
    renderMeta();
    renderList();
    try{ localStorage.setItem("md-notes-last", id || ""); }catch(e){}
    publishPresence();
    editor.scrollTop = 0;
  }

  var saveTimer = null;
  var pendingAfterSave = false;

  function markDirty(){
    state.dirty = editor.value !== state.savedText;
    if (!state.dirty) return;
    setSync("saving", "저장 중…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 600);
  }

  function flushSave(){
    clearTimeout(saveTimer);
    if (!state.currentId || !state.dirty || state.readOnly) return;
    if (state.saving){ pendingAfterSave = true; return; }

    var id = state.currentId;
    var text = editor.value;
    var existing = currentNote() || {};
    var payload = {
      title: deriveTitle(text),
      body: text,
      updatedAt: Date.now(),
      updatedBy: state.uid || null,
      createdAt: existing.createdAt || Date.now()
    };

    state.saving = true;
    state.dirty = false;
    setSync("saving", "저장 중…");

    repo.save(id, payload).then(function(){
      state.saving = false;
      state.savedText = text;
      setSync(state.mode === "shared" ? "saved" : "local",
              state.mode === "shared" ? "저장됨 · 모두와 공유 중" : "이 브라우저에만 저장됨");
      if (pendingAfterSave || editor.value !== state.savedText){
        pendingAfterSave = false;
        state.dirty = editor.value !== state.savedText;
        if (state.dirty) flushSave();
      }
    }).catch(function(err){
      state.saving = false;
      pendingAfterSave = false;
      var code = err && err.code;
      if (code === "invalid_argument"){
        enterReadOnly("이 노트를 편집할 권한이 없습니다. 읽기 전용으로 표시합니다.");
      } else if (code === "revoked" || code === "not_granted"){
        enterReadOnly("공유 저장소에 더 이상 접근할 수 없습니다. 읽기 전용으로 표시합니다.");
      } else {
        state.dirty = true;
        setSync("error", "저장 실패 — 다시 시도 중");
        clearTimeout(saveTimer);
        saveTimer = setTimeout(flushSave, 3000);
      }
    });
  }

  function enterReadOnly(message){
    state.readOnly = true;
    state.dirty = false;
    editor.readOnly = true;
    $("newNote").disabled = true;
    $("deleteNote").disabled = true;
    setSync("error", "읽기 전용");
    showNotice(message, null, null);
  }

  /* ── incoming updates ────────────────────────────────── */

  function applyNotes(notes){
    state.notes = notes;

    if (!state.currentId || !currentNote()){
      var last = null;
      try{ last = localStorage.getItem("md-notes-last"); }catch(e){}
      var target = (last && notes.some(function(n){ return n.id === last; })) ? last
                 : (notes[0] ? notes[0].id : null);
      state.currentId = null;
      if (target) selectNote(target, { force:true });
      else { editor.value = ""; state.savedText = ""; renderPreviewPane(); }
    } else {
      var note = currentNote();
      if (note.body !== state.savedText){
        // Somebody else changed this note.
        if (!state.dirty && !state.saving && document.activeElement !== editor){
          editor.value = note.body;
          state.savedText = note.body;
          renderPreviewPane();
          hideNotice();
        } else if (!state.dirty && !state.saving){
          // Focused but nothing unsaved: refresh in place, keep the caret where it can go.
          var pos = editor.selectionStart;
          editor.value = note.body;
          state.savedText = note.body;
          try{ editor.setSelectionRange(Math.min(pos, note.body.length), Math.min(pos, note.body.length)); }catch(e){}
          renderPreviewPane();
          hideNotice();
        } else {
          var name = note.updatedBy && state.profiles[note.updatedBy] && state.profiles[note.updatedBy].name;
          showNotice((name || "다른 사람") + "이(가) 이 노트를 수정했습니다. 저장하면 내 내용으로 덮어씁니다.",
                     "최신 내용 불러오기", function(){
            var fresh = currentNote();
            if (!fresh) return;
            editor.value = fresh.body;
            state.savedText = fresh.body;
            state.dirty = false;
            clearTimeout(saveTimer);
            renderPreviewPane();
            hideNotice();
            setSync(state.mode === "shared" ? "saved" : "local",
                    state.mode === "shared" ? "저장됨 · 모두와 공유 중" : "이 브라우저에만 저장됨");
          });
        }
      }
    }

    renderList();
    renderMeta();
    renderBlankState();
    resolveProfiles();
  }

  /* ── presence ────────────────────────────────────────── */

  var roomNs = null, userNs = null;

  function publishPresence(){
    if (!roomNs) return;
    var patch = { note: state.currentId || null };
    if (state.uid) patch.uid = state.uid;
    roomNs.presence(patch).catch(function(){});
  }

  /* ── actions ─────────────────────────────────────────── */

  function createNote(){
    if (state.readOnly) return;
    flushSave();
    var id = newId();
    var now = Date.now();
    var body = "# 새 노트\n\n";
    var payload = { title: deriveTitle(body), body: body, updatedAt: now, updatedBy: state.uid || null, createdAt: now };
    state.notes = [{ id:id, title:payload.title, body:body, updatedAt:now, updatedBy:state.uid||null, createdAt:now }].concat(state.notes);
    selectNote(id, { force:true });
    renderBlankState();
    repo.save(id, payload).catch(function(err){
      if (err && (err.code === "invalid_argument" || err.code === "revoked")){
        enterReadOnly("새 노트를 만들 권한이 없습니다. 읽기 전용으로 표시합니다.");
      } else {
        setSync("error", "노트를 만들지 못했습니다");
      }
    });
    editor.focus();
    editor.setSelectionRange(editor.value.length, editor.value.length);
  }

  function deleteCurrent(){
    var note = currentNote();
    if (!note || state.readOnly) return;
    var label = note.title || deriveTitle(note.body);
    if (!window.confirm('"' + label + '" 노트를 삭제할까요? 이 페이지를 보는 모두에게서 사라집니다.')) return;
    clearTimeout(saveTimer);
    state.dirty = false;
    var id = note.id;
    state.currentId = null;
    repo.remove(id).catch(function(){ setSync("error", "삭제하지 못했습니다"); });
  }

  function setView(view){
    app.setAttribute("data-view", view);
    Array.prototype.forEach.call(document.querySelectorAll("#viewSeg button"), function(b){
      b.setAttribute("aria-pressed", String(b.dataset.view === view));
    });
    try{ localStorage.setItem("md-notes-view", view); }catch(e){}
  }

  function openList(){ app.setAttribute("data-list","open"); $("listToggle").setAttribute("aria-expanded","true"); }
  function closeList(){ app.setAttribute("data-list","closed"); $("listToggle").setAttribute("aria-expanded","false"); }

  /* ── wiring ──────────────────────────────────────────── */

  editor.addEventListener("input", function(){
    renderPreviewPane();
    markDirty();
  });
  editor.addEventListener("blur", flushSave);
  editor.addEventListener("keydown", function(e){
    if ((e.metaKey || e.ctrlKey) && e.key === "s"){ e.preventDefault(); flushSave(); }
    if (e.key === "Tab"){
      e.preventDefault();
      var s = editor.selectionStart, en = editor.selectionEnd;
      editor.value = editor.value.slice(0,s) + "  " + editor.value.slice(en);
      editor.setSelectionRange(s+2, s+2);
      renderPreviewPane();
      markDirty();
    }
  });
  document.addEventListener("visibilitychange", function(){ if (document.hidden) flushSave(); });
  window.addEventListener("pagehide", flushSave);

  $("newNote").onclick = createNote;
  $("blankNew").onclick = createNote;
  $("deleteNote").onclick = deleteCurrent;
  $("listToggle").onclick = function(){
    if (app.getAttribute("data-list") === "open") closeList(); else openList();
  };
  $("scrim").onclick = closeList;
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeList(); });

  Array.prototype.forEach.call(document.querySelectorAll("#viewSeg button"), function(b){
    b.onclick = function(){ setView(b.dataset.view); };
  });

  searchInput.addEventListener("input", function(){
    state.filter = searchInput.value.trim();
    renderList();
  });

  setInterval(function(){ renderList(); renderMeta(); }, 60000);

  // Restore view preference; a narrow screen has no split.
  var savedView = "split";
  try{ savedView = localStorage.getItem("md-notes-view") || "split"; }catch(e){}
  if (window.matchMedia("(max-width:880px)").matches && savedView === "split") savedView = "edit";
  setView(savedView);
  renderPreviewPane();
  renderBlankState();

  /* ── capabilities: shared store, people, live room ───── */

  function startSubscription(){
    if (unsubscribeNotes) unsubscribeNotes();
    unsubscribeNotes = repo.subscribe(applyNotes, function(err){
      var code = err && err.code;
      if (code === "revoked" || code === "not_granted"){
        enterReadOnly("공유 저장소 연결이 끊어졌습니다. 페이지를 새로고침해 주세요.");
      } else {
        setSync("error", "동기화가 끊겼습니다 — 새로고침해 주세요");
      }
    });
  }

  startSubscription();
  setSync("local", "이 브라우저에만 저장됨");

  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("db").then(function(db){
      if (!db) return;
      var localNotes = state.notes.slice();
      repo = makeDbRepo(db);
      state.mode = "shared";
      setSync("saved", "저장됨 · 모두와 공유 중");
      state.currentId = null;
      startSubscription();
      // Carry anything written before the shared store answered.
      localNotes.forEach(function(n){
        if (!n.body || !n.body.trim()) return;
        repo.save(n.id, {
          title: n.title || deriveTitle(n.body), body: n.body,
          updatedAt: n.updatedAt || Date.now(), updatedBy: state.uid || null,
          createdAt: n.createdAt || Date.now()
        }).catch(function(){});
      });
    }).catch(function(){});

    window.claude.use("user").then(function(u){
      if (!u) return;
      userNs = u;
      u.id().then(function(id){ state.uid = id; publishPresence(); }).catch(function(){});
      u.can("data.write").then(function(ok){
        if (ok === false) enterReadOnly("보기 전용으로 공유된 페이지입니다. 편집은 할 수 없습니다.");
      }).catch(function(){});
      resolveProfiles();
    }).catch(function(){});

    window.claude.use("room").then(function(r){
      if (!r) return;
      roomNs = r;
      r.onPeers(function(change){
        state.peers = change.peers;
        renderPeople();
        renderList();
        resolveProfiles();
      }, function(){});
      publishPresence();
    }).catch(function(){});
  }
})();
</script>
